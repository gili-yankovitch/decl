[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decl"
version = "0.1.0"
description = "Declarative Electronic Component Language"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["decl*"]

[project.scripts]
decl = "decl.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
